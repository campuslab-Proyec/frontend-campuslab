server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html y env.js siempre frescos: así el navegador no queda con una versión vieja de la app
    # (los main-*.js llevan hash en el nombre y sí se pueden cachear).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # DNS interno de Docker. Con el upstream en una variable, nginx resuelve el nombre en cada
    # petición en vez de al arrancar: si el BFF aún no está listo, nginx igual levanta (y /api da 502
    # temporalmente) en lugar de morir con "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff_upstream http://ms-campuslab-bff:8080;

    # Proxy al BFF: el navegador llama a https://tu-dominio/api/... (mismo origen, sin CORS ni mixed content)
    location /api/ {
        proxy_pass $bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
    }

    # SPA fallback de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}