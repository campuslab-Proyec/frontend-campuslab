<header style="padding: 1rem; background-color: #f4f4f4; border-bottom: 1px solid #ccc;">
    <h1>CampusLab - Sistema de Reservas</h1>

    <nav style="margin-bottom: 1rem;">
        <a routerLink="/bookings">Reservas</a>
    </nav>

    <div>
        @if (!isLoggedIn) {
            <button (click)="login()">Iniciar Sesión con Microsoft</button>
        } @else {
            <button (click)="logout()">Cerrar Sesión</button>
        }
    </div>
</header>

<main style="padding: 2rem;">
    @if (!isLoggedIn) {
        <section>
            <h2>Bienvenido a CampusLab</h2>
            <p>Por favor inicia sesión con tu cuenta institucional para continuar.</p>
        </section>
    }

    <!-- Vista de las rutas protegidas -->
    <router-outlet></router-outlet>
</main>
